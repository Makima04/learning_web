name: build-and-push-image

# 触发：push main 或手动 Dispatch
#
# 镜像全部在 GitHub 上构建，本地不再参与（不需要 Docker Desktop，也不需要
# docker.io 可访问的镜像加速做法）：
#
#   1. lint / test
#   2. build（matrix，两个原生 runner 并行）
#        linux/amd64  @ ubuntu-24.04      → :amd64-latest / :amd64-<sha>
#        linux/arm64  @ ubuntu-24.04-arm  → :arm64-latest / :arm64-<sha>
#      两个架构都是**原生编译**，不走 QEMU —— Rust release 构建耗时接近本机
#   3. manifest：docker buildx imagetools 把两个单平台镜像合成 multi-arch
#        → :latest / :<sha>
#
# 生产 Orange Pi（arm64）直接 pull :latest（multi-arch）即可。
# 仓库是 public，GitHub 托管的 arm64 runner 免费，不占 ARM 计费分钟。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一 ref 串行发布，避免两次 push 交错覆盖 :latest（不做 cancel-in-progress，
# 发布中途取消会留下半套 per-arch 标签）
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装开发依赖
        run: pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: ruff check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: english_test
          POSTGRES_PASSWORD: english_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english_test -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://english_test:english_test@localhost:5432/postgres
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # —— Frontend（vitest）——
      # package.json 无 engines；用 Node 20。package-lock.json 已存在。
      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端单元测试
        working-directory: frontend
        run: npm test

      - name: 更新服务故障恢复测试
        run: python3 -m unittest discover -s scripts/web_updater -p 'test_*.py'

      # —— Backend：纯单元测试 + SQLx 自动创建/清理隔离数据库的集成测试 ——
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: 后端单元测试
        run: cargo test --manifest-path backend/Cargo.toml

  # 按架构并行构建单平台镜像。原生 runner 上 4 vCPU 可全开 cargo 并行。
  build:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # 推到 ghcr.io 需要的权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算镜像名（小写仓库名）
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只推 :<arch>-* 标签；multi-arch 的 :latest / :<sha> 由 manifest job 合成，
      # 避免两个 arch 互相覆盖。
      # provenance / sbom 关闭：per-arch 产物保持纯单平台 manifest，合成后干净。
      - name: 构建并推送 ${{ matrix.arch }} 镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            EW_VERSION=${{ github.sha }}
            EW_BUILD_JOBS=4
          tags: |
            ${{ steps.meta.outputs.image }}:${{ matrix.arch }}-latest
            ${{ steps.meta.outputs.image }}:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true

      - name: 输出摘要
        run: |
          {
            echo "### ${{ matrix.arch }}"
            echo ""
            echo "- platform: \`${{ matrix.platform }}\`（原生 runner: \`${{ matrix.runner }}\`）"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- tags: \`${{ matrix.arch }}-latest\`, \`${{ matrix.arch }}-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 把两个单平台镜像合成 multi-arch（这一步只操作 manifest，不构建、秒级完成）
  manifest:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合成 multi-arch :latest / :<sha>
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}"
          SHA="${{ github.sha }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${SHA}" \
            "${IMAGE}:amd64-${SHA}" \
            "${IMAGE}:arm64-${SHA}"
          echo "### multi-arch \`:latest\` / \`:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
