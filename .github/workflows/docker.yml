name: build-and-push-amd64-image

# 触发：push main 或手动 Dispatch
#
# 分工：
#   - CI（本 workflow）只构建并推送 linux/amd64 标签：:amd64-latest / :amd64-<sha>
#   - arm64 在本地 macOS 构建：./scripts/publish-arm64-image.sh
#     该脚本再把 amd64+arm64 合成 multi-arch 的 :latest / :<sha>
#
# 生产 Orange Pi（arm64）应 pull :latest（multi-arch），不要只依赖 CI 产物。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装开发依赖
        run: pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: ruff check .

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推到 ghcr.io 需要的权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名（小写仓库名）
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "构建镜像: $IMAGE (linux/amd64 only；arm64 见 scripts/publish-arm64-image.sh)"

      # 只打 :amd64-*，不要覆盖 :latest / :<sha>
      # multi-arch :latest 由本地 arm 脚本 imagetools 合成。
      - name: 构建并推送 AMD64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: EW_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:amd64-latest
            ${{ steps.meta.outputs.image }}:amd64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
