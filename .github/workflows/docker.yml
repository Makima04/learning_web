name: build-and-push-image

# 触发条件：推送到 main 分支，或手动 Dispatch
# 约束：必须同时推送 linux/amd64 与 linux/arm64（生产 Orange Pi 等为 arm64；
#       仅 amd64 会导致板子 pull :latest 仍停在旧 arm64 镜像）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装开发依赖
        run: pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: ruff check .

      - name: Pytest 单元测试
        run: pytest -q

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推到 ghcr.io 需要的权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（交叉构建 arm64）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名（小写仓库名）
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "构建镜像: $IMAGE (linux/amd64 + linux/arm64)"

      # multi-arch manifest：:latest / :sha 在 amd64 与 arm64 主机上都能 pull 到对应层。
      # 同时保留 :amd64-* / :arm64-* 标签（内容同为 multi-arch manifest，兼容旧 compose）。
      - name: 构建并推送 multi-arch 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: EW_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:amd64-latest
            ${{ steps.meta.outputs.image }}:amd64-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:arm64-latest
            ${{ steps.meta.outputs.image }}:arm64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
