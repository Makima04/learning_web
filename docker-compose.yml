# english_web: Rust API + PostgreSQL + 静态前端
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: english
      POSTGRES_PASSWORD: english
      POSTGRES_DB: english_web
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 宿主机 5433，避免与本地 PG 冲突
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english -d english_web"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      EW_DATABASE_URL: postgres://english:english@db:5432/english_web
      EW_HOST: 0.0.0.0
      EW_PORT: 8000
      EW_STATIC_DIR: /app/frontend/dist
      EW_ALLOW_FIRST_ADMIN: ${EW_ALLOW_FIRST_ADMIN:-1}
      EW_SESSION_TTL_DAYS: ${EW_SESSION_TTL_DAYS:-30}
      EW_LLM_URL: ${EW_LLM_URL:-}
      EW_LLM_KEY: ${EW_LLM_KEY:-}
      EW_LLM_MODEL: ${EW_LLM_MODEL:-}
      RUST_LOG: english_web_server=info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
