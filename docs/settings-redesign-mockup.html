<!DOCTYPE html>
<!--
  红宝书 · 设置页重设计 · 高保真设计稿
  独立 mockup，不依赖 web/ 下任何资源。双击即可在浏览器打开。
  设计要点：
    1. 顶栏精简：仅 Logo / 暗黑模式 / 用户头像，去掉与左侧栏冗余的 tab 导航。
    2. 左侧边栏：5 项分类，首项「学习」薄荷绿高亮。
    3. 中央内容区：浅灰底，3 张卡片（每日新词数 / 记忆方向 / 每组词数）垂直居中。
    4. 每日新词数：滑块 + 跟随拇指的数值气泡。
    5. 记忆方向：带语言国旗的圆角块状按钮。
    6. 视觉：10px 圆角、柔阴影、薄荷绿主色 #10b981。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红宝书 · 设置（设计稿）</title>
<style>
  :root{
    --bg:#f1f5f9; --bg-soft:#e2e8f0; --bg-track:#e2e8f0;
    --card:#ffffff;
    --line:#e5e7eb; --line-soft:#f3f4f6;
    --txt:#0f172a; --txt-2:#475569; --txt-3:#64748b; --txt-4:#94a3b8;
    --brand:#10b981; --brand-hover:#34d399; --brand-soft:#ecfdf5; --brand-line:#a7f3d0;
    --shadow-card:0 4px 16px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --shadow-nav:0 6px 16px rgba(16,185,129,.28);
    --r-card:10px; --r-btn:10px;
    --header-h:56px; --sidebar-w:204px;
    font-synthesis:none;
  }
  [data-theme="dark"]{
    --bg:#0f172a; --bg-soft:#1e293b; --bg-track:#334155;
    --card:#1f2937;
    --line:#374151; --line-soft:#283246;
    --txt:#f3f4f6; --txt-2:#d1d5db; --txt-3:#9ca3af; --txt-4:#6b7280;
    --brand:#10b981; --brand-hover:#34d399; --brand-soft:#10b9811a; --brand-line:#10b98155;
    --shadow-card:0 4px 16px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
    --shadow-nav:0 6px 16px rgba(16,185,129,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  button{font-family:inherit; color:inherit;}

  /* ===== 顶栏（精简） ===== */
  .topbar{
    height:var(--header-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
    background:var(--card);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:baseline; gap:8px; font-size:17px; font-weight:700;}
  .brand .logo{color:var(--brand);}
  .brand span{color:var(--txt);}
  .brand small{font-size:11px; color:var(--txt-3); font-weight:400;}
  .top-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:36px; height:36px; border-radius:10px;
    border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; cursor:pointer; transition:all .15s;
  }
  .icon-btn:hover{border-color:var(--brand); color:var(--brand); background:var(--brand-soft);}
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand-hover));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:14px; cursor:pointer;
    box-shadow:0 2px 8px rgba(16,185,129,.35);
  }

  /* ===== 布局 ===== */
  .layout{display:flex; min-height:calc(100vh - var(--header-h));}
  .sidebar{
    flex:0 0 var(--sidebar-w);
    padding:18px 14px;
    display:flex; flex-direction:column; gap:3px;
  }
  .nav-title{
    font-size:11px; color:var(--txt-4); text-transform:uppercase;
    letter-spacing:.08em; padding:8px 12px 6px; font-weight:600;
  }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:var(--r-btn);
    color:var(--txt-3); font-size:14px; font-weight:500;
    cursor:pointer; border:none; background:transparent;
    text-align:left; transition:all .15s; position:relative;
  }
  .nav-item:hover{background:var(--brand-soft); color:var(--brand);}
  .nav-item.active{
    background:var(--brand); color:#fff;
    box-shadow:var(--shadow-nav);
  }
  .nav-item .ic{
    width:26px; height:26px; border-radius:7px;
    background:var(--bg-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; flex:none;
  }
  .nav-item.active .ic{background:rgba(255,255,255,.22);}

  /* ===== 内容区 ===== */
  .content{
    flex:1; padding:28px 32px 40px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .section-head{
    width:100%; max-width:560px; margin-bottom:18px;
    display:flex; align-items:baseline; gap:10px;
  }
  .section-head h2{margin:0; font-size:20px; font-weight:700; color:var(--txt);}
  .section-head .sub{font-size:12px; color:var(--txt-4);}
  .cards{
    width:100%; max-width:560px;
    display:flex; flex-direction:column; gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r-card);
    padding:20px 22px;
    box-shadow:var(--shadow-card);
  }
  .card-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px; gap:8px;
  }
  .card-title{font-size:14px; font-weight:600; color:var(--txt);}
  .card-hint{font-size:11px; color:var(--txt-4);}

  /* ===== 滑块 + 气泡 ===== */
  .slider-wrap{position:relative; padding:30px 0 6px;}
  .slider-bubble{
    position:absolute; top:0; left:20%;
    transform:translateX(-50%);
    background:var(--brand); color:#fff;
    padding:3px 10px; border-radius:8px;
    font-size:12px; font-weight:600;
    font-variant-numeric:tabular-nums;
    box-shadow:0 2px 6px rgba(16,185,129,.35);
    transition:left .05s linear;
    pointer-events:none;
  }
  .slider-bubble::after{
    content:""; position:absolute; bottom:-3px; left:50%;
    transform:translateX(-50%) rotate(45deg);
    width:8px; height:8px; background:var(--brand);
  }
  .slider{
    -webkit-appearance:none; appearance:none;
    width:100%; height:6px; border-radius:99px;
    background:linear-gradient(to right,var(--brand) 0%,var(--brand) 20%,var(--bg-track) 20%,var(--bg-track) 100%);
    outline:none; margin:0;
  }
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:#fff; border:2px solid var(--brand);
    box-shadow:0 2px 8px rgba(16,185,129,.4);
    cursor:pointer; transition:transform .12s;
  }
  .slider::-webkit-slider-thumb:hover{transform:scale(1.12);}
  .slider::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%;
    background:#fff; border:2px solid var(--brand);
    box-shadow:0 2px 8px rgba(16,185,129,.4); cursor:pointer;
  }
  .slider-meta{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--txt-4); margin-top:10px;
  }
  .slider-meta b{color:var(--txt-2); font-weight:600;}

  /* ===== 记忆方向：国旗块状按钮 ===== */
  .dir-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .dir-btn{
    border:1.5px solid var(--line); background:var(--card);
    border-radius:var(--r-btn); padding:16px 6px 14px;
    display:flex; flex-direction:column; align-items:center; gap:9px;
    cursor:pointer; transition:all .15s; position:relative;
  }
  .dir-btn:hover{border-color:var(--brand-line); background:var(--brand-soft);}
  .dir-btn.active{
    border-color:var(--brand); background:var(--brand-soft);
    box-shadow:0 0 0 3px rgba(16,185,129,.14);
  }
  .dir-btn .flags{display:flex; align-items:center; gap:4px; font-size:22px; line-height:1;}
  .dir-btn .arrow{font-size:13px; color:var(--txt-3); font-weight:600;}
  .dir-btn.active .arrow{color:var(--brand);}
  .dir-btn .label{font-size:13px; font-weight:600; color:var(--txt-2);}
  .dir-btn.active .label{color:var(--brand);}
  .dir-btn.active::after{
    content:"✓"; position:absolute; top:7px; right:7px;
    width:18px; height:18px; border-radius:50%;
    background:var(--brand); color:#fff;
    font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  /* ===== 每组词数：分段块状按钮 ===== */
  .group-grid{display:flex; gap:10px;}
  .group-btn{
    flex:1; padding:13px 0; border-radius:var(--r-btn);
    border:1.5px solid var(--line); background:var(--card);
    display:flex; flex-direction:column; align-items:center; gap:1px;
    cursor:pointer; transition:all .15s;
  }
  .group-btn:hover{border-color:var(--brand-line); background:var(--brand-soft);}
  .group-btn.active{
    border-color:var(--brand); background:var(--brand-soft);
    box-shadow:0 0 0 3px rgba(16,185,129,.14);
  }
  .group-btn .num{font-size:20px; font-weight:700; color:var(--txt); font-variant-numeric:tabular-nums;}
  .group-btn.active .num{color:var(--brand);}
  .group-btn .unit{font-size:11px; color:var(--txt-4);}

  /* ===== 响应式：窄屏收起侧栏 ===== */
  @media (max-width:860px){
    .sidebar{display:none;}
    .content{padding:20px 16px 32px;}
    .dir-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body data-theme="light">

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="brand">
    <span class="logo">📕</span>
    <span>红宝书</span>
    <small>乱序 · 6550</small>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btn-theme" title="切换主题">🌙</button>
    <div class="avatar" title="账号">M</div>
  </div>
</header>

<!-- ============ 布局 ============ -->
<div class="layout">

  <!-- 左侧边栏 -->
  <aside class="sidebar">
    <div class="nav-title">设置</div>
    <button class="nav-item active" data-s="study"><span class="ic">📖</span>学习</button>
    <button class="nav-item" data-s="speech"><span class="ic">🔊</span>发音</button>
    <button class="nav-item" data-s="llm"><span class="ic">🌐</span>翻译</button>
    <button class="nav-item" data-s="account"><span class="ic">👤</span>账号</button>
    <button class="nav-item" data-s="data"><span class="ic">💾</span>数据</button>
  </aside>

  <!-- 中央内容区 -->
  <main class="content">
    <div class="section-head">
      <h2>学习设置</h2>
      <span class="sub">即时保存</span>
    </div>

    <div class="cards">

      <!-- 卡片 1：每日新词数 -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">每日新词数</span>
          <span class="card-hint">每天新引入的单词量</span>
        </div>
        <div class="slider-wrap">
          <div class="slider-bubble" id="daily-bubble">20</div>
          <input type="range" id="daily-slider" class="slider" min="0" max="100" step="5" value="20">
        </div>
        <div class="slider-meta">
          <span>0</span><span><b id="daily-val">20</b> 词 / 天</span><span>100</span>
        </div>
      </div>

      <!-- 卡片 2：记忆方向 -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">记忆方向</span>
          <span class="card-hint">卡片正面显示哪种语言</span>
        </div>
        <div class="dir-grid" id="dir-group">
          <button class="dir-btn active" data-v="en2cn">
            <div class="flags"><span>🇬🇧</span><span class="arrow">→</span><span>🇨🇳</span></div>
            <div class="label">英 → 中</div>
          </button>
          <button class="dir-btn" data-v="cn2en">
            <div class="flags"><span>🇨🇳</span><span class="arrow">→</span><span>🇬🇧</span></div>
            <div class="label">中 → 英</div>
          </button>
          <button class="dir-btn" data-v="random">
            <div class="flags"><span>🇬🇧</span><span class="arrow">⇄</span><span>🇨🇳</span></div>
            <div class="label">随机</div>
          </button>
        </div>
      </div>

      <!-- 卡片 3：每组词数 -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">每组词数</span>
          <span class="card-hint">背完一组后展示本组全部单词</span>
        </div>
        <div class="group-grid" id="group-select">
          <button class="group-btn" data-v="10"><span class="num">10</span><span class="unit">词 / 组</span></button>
          <button class="group-btn active" data-v="20"><span class="num">20</span><span class="unit">词 / 组</span></button>
          <button class="group-btn" data-v="40"><span class="num">40</span><span class="unit">词 / 组</span></button>
        </div>
      </div>

    </div>
  </main>

</div>

<script>
  // ---- 滑块气泡 + 填充轨道 ----
  const slider = document.getElementById('daily-slider');
  const bubble = document.getElementById('daily-bubble');
  const valEl  = document.getElementById('daily-val');
  const min = +slider.min, max = +slider.max;

  function updateSlider(){
    const v = +slider.value;
    const pct = ((v - min) / (max - min)) * 100;
    // 气泡跟随拇指：用百分比定位，并补偿拇指半宽避免越界
    const thumbW = 20;
    const leftPx = (pct / 100) * (slider.offsetWidth - thumbW) + thumbW / 2;
    bubble.style.left = leftPx + 'px';
    bubble.textContent = v;
    valEl.textContent = v;
    const bgTrack = getComputedStyle(document.body).getPropertyValue('--bg-track').trim();
    slider.style.background =
      `linear-gradient(to right, var(--brand) 0%, var(--brand) ${pct}%, ${bgTrack} ${pct}%, ${bgTrack} 100%)`;
  }
  slider.addEventListener('input', updateSlider);
  window.addEventListener('resize', updateSlider);

  // ---- 记忆方向 ----
  document.querySelectorAll('#dir-group .dir-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#dir-group .dir-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  // ---- 每组词数 ----
  document.querySelectorAll('#group-select .group-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#group-select .group-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  // ---- 侧栏切换 ----
  document.querySelectorAll('.nav-item').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  // ---- 暗黑模式 ----
  const themeBtn = document.getElementById('btn-theme');
  themeBtn.addEventListener('click', () => {
    const cur = document.body.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    requestAnimationFrame(updateSlider);
  });

  // 初始化
  updateSlider();
</script>

</body>
</html>
